name: CustomJoinMessages
version: ${version}
main: net.insprill.cjm.CustomJoinMessages
api-version: 1.13
folia-supported: true
author: Insprill
description: The most advanced custom join messages plugin on the market.
website: https://github.com/JiuJiumc/JiuJiuhuanying

softdepend:
  - JiuJiuLib
  - AdvancedVanish
  - AuthMe
  - CMI
  - Essentials
  - PlaceholderAPI
  - PremiumVanish
  - SayanVanish
  - SuperVanish
  - VanishNoPacket
  - Vault
  - VelocityVanish

permissions:
  jiujiuhuanying.test:
    description: 模拟新人欢迎与真实奖励测试；测试按钮仅管理员可见和领取
    default: op
  jiujiuhuanying.welcome:
    description: 点击新人欢迎提示获得欢迎奖励
    default: true
  cjm.default:
    default: true
