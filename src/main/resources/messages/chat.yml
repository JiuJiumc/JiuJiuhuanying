# 基于用户132321.zip配置恢复：中文消息，保留原开关和参数。
# Toggles whether chat messages should be sent.
Enabled: true

Public:
  # Whether public chat messages should be sent to the server's console.
  Send-To-Console: true
  First-Join:
    1:
      Permission: cjm.default
      Radius: -1
      Max-Players: -1
      Messages:
        1:
          - "&f[&4!&f] &a欢迎 &f%name% &a首次加入服务器！ &8(&a#%uniquejoins%&8)"
  Join:
    1:
      Permission: cjm.default
      Messages:
        1:
          - "&f[&4!&f] &a%name% &7加入了服务器。"
  Quit:
    1:
      Permission: cjm.default
      Messages:
        1:
          - "&f[&4!&f] &e%name% &7离开了服务器。"

Private:
  First-Join:
    1:
      Permission: cjm.default
      Messages:
        1:
          - "&f[&4!&f] &a欢迎来到服务器，祝你玩得开心！"
  Join:
    1:
      Permission: cjm.default
      Messages:
        1:
          - "&f[&4!&f] &a欢迎回来！"
